<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dziennik Instruktora</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ekran logowania -->
  <div id="view-login" class="login-wrap hidden">
    <div class="login-card">
      <h1>Dziennik<sup>°</sup></h1>
      <p class="subtitle">Twoi jeźdźcy, konie i treningi w jednym miejscu</p>
      <form id="login-form">
        <label class="f">E-mail</label>
        <input class="f" id="email" type="email" autocomplete="email" required />
        <label class="f">Hasło</label>
        <input class="f" id="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn-primary">Zaloguj się</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <!-- Aplikacja -->
  <div id="view-app" class="hidden">
    <main id="content"></main>
  </div>

  <!-- Pasek nawigacji — zawsze na wierzchu, poza view-app -->
  <nav class="tabbar hidden" id="tabbar">
    <button class="tab active" data-screen="start" title="Start">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>
    <button class="tab" data-screen="jezdzcy" title="Jeźdźcy">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg></button>
    <button class="tab-plus" id="btn-plus" title="Nowy trening">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-screen="konie" title="Konie">
      <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M10 1L13 4Q17 5.5 19 9Q21 12 20.5 14Q19.5 16.5 15.5 16.5Q12.5 16.5 11.5 17.5L12.5 23H6V17.5Q7.5 14.5 8.5 14Q8.5 8 7.5 3.5Z"/><circle cx="17" cy="10" r="1.1"/></svg></button>
    <button class="tab" data-screen="treningi" title="Treningi">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v17H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg></button>
  </nav>

  <!-- Cwałek: pływający przycisk czatu -->
  <button id="cwalek-btn" title="Porozmawiaj z Cwałkiem" aria-label="Otwórz czat z Cwałkiem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="28" height="28" fill="currentColor"><path d="M462.1 62.86L424.6 6.325C423 3.918 420.3 2.5 417.4 2.5c-1.188 0-2.406.25-3.531.8125L337.1 38.69C320.2 29.83 301.1 24.5 281.6 24.5c-73.38 0-133 59.63-133 133c0 24.13 6.625 46.75 18 66.13L107 298.3c-8.875 9.25-13.75 21.5-13.75 34.38C93.25 361.9 117.3 386 147 386h13.88L133.1 478.3C130.4 487.8 137.6 497.5 147.4 497.5h215.3c9.75 0 16.88-9.625 14.25-19.13L349.1 386H363c29.75 0 53.75-24.13 53.75-53.38c0-12.88-4.625-25.13-13.5-34.38l-59.62-74.88C344.5 204 345.6 158.9 344.8 137c-0.375-10.25-8.875-18.38-19.13-17.75c-10.25 .625-18.25 9.125-17.63 19.38c.5 7.625 .5 16.63-.125 26.38c-22.5-19.88-36.88-48.75-36.88-80.5c0-59.25 48.25-107.5 107.5-107.5c18.75 0 36.38 5.125 51.5 13.88c5.375 3.125 12.13 2.25 16.5-2.25l50.5-51.5c4.625-4.75 4.875-12.25.5-17.25z"/></svg></button>

  <!-- Cwałek: panel czatu -->
  <div id="cwalek-panel" class="cwalek-panel hidden" role="dialog" aria-label="Cwałek — asystent stajni">
    <div class="cwalek-header">
      <span class="cwalek-avatar">🐴</span>
      <div>
        <div class="cwalek-name">Cwałek</div>
        <div class="cwalek-sub">asystent stajni</div>
      </div>
      <button class="cwalek-close" id="cwalek-close" aria-label="Zamknij">✕</button>
    </div>
    <div class="cwalek-messages" id="cwalek-messages">
      <div class="cwalek-msg cwalek-msg--bot">
        <p>Cześć! Jestem Cwałek 🐴 Pytaj o jeźdźców, treningi, postępy — chętnie pomogę!</p>
      </div>
    </div>
    <div class="cwalek-input-row">
      <input type="text" id="cwalek-input" placeholder="Napisz do Cwałka…" autocomplete="off" />
      <button id="cwalek-send" aria-label="Wyślij">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dziennik Instruktora</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <!-- Ekran ładowania -->
  <div id="view-splash" style="position:fixed;inset:0;background:#FCFAF7;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:48px;">
      <div style="font-size:34px;font-weight:700;color:#557F69;letter-spacing:-.02em;line-height:1">Dziennik<sup style="color:#F2A98B;font-size:15px">°</sup></div>
      <div style="font-size:11px;color:#8aab97;letter-spacing:.1em;font-weight:500;text-transform:uppercase">Instruktora</div>
    </div>
    <div style="position:absolute;bottom:0;left:0;right:0;padding:0 0 40px;">
      <div id="splash-quote" style="text-align:center;font-size:13px;color:#8aab97;font-style:italic;margin-bottom:14px;padding:0 32px;min-height:20px;transition:opacity .4s"></div>
      <div style="height:2px;background:#EAF2ED;position:relative;overflow:hidden;">
        <div id="splash-bar" style="position:absolute;left:0;top:0;height:100%;width:0%;background:#557F69;transition:width .05s linear;border-radius:2px;"></div>
      </div>
    </div>
  </div>
  <style>
    #splash-quote.fade{opacity:0}
  </style>
  <script>
    (function(){
      const quotes = [
        "Koń uczy cierpliwości.",
        "Każdy trening to krok naprzód.",
        "Zaufanie buduje się w siodle.",
        "Dobry instruktor słucha konia i jeźdźca.",
        "Rytm, równowaga, relaks.",
        "Koń nie kłamie.",
        "Praca z koniem to praca nad sobą.",
      ];
      let q = 0, pct = 0;
      const bar = document.getElementById('splash-bar');
      const quote = document.getElementById('splash-quote');

      function setQuote(text){ quote.textContent = text; quote.style.opacity = 1; }
      setQuote(quotes[Math.floor(Math.random()*quotes.length)]);

      const iv = setInterval(()=>{
        pct += 1.4;
        if(pct >= 100) pct = 100;
        bar.style.width = pct + '%';

        // zmień cytat co ~25%
        if(pct % 25 < 1.4 && pct > 10){
          quote.style.opacity = 0;
          setTimeout(()=>{
            q = (q+1) % quotes.length;
            setQuote(quotes[q]);
          }, 400);
        }

        if(pct >= 100) clearInterval(iv);
      }, 30);
    })();
  </script>

  <!-- Ekran logowania -->
  <div id="view-login" class="login-wrap hidden" style="position:relative;">
    <a href="docs.html" style="position:absolute;top:20px;right:20px;font-size:13px;font-weight:500;color:#557F69;text-decoration:none;opacity:.7;">API docs</a>
    <div class="login-card">
      <h1>Dziennik<sup>°</sup></h1>
      <p class="subtitle">Twoi jeźdźcy, konie i treningi w jednym miejscu</p>
      <form id="login-form">
        <label class="f">E-mail</label>
        <input class="f" id="email" type="email" autocomplete="email" required />
        <label class="f">Hasło</label>
        <input class="f" id="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn-primary">Zaloguj się</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <!-- Aplikacja -->
  <div id="view-app" class="hidden">
    <main id="content"></main>
  </div>

  <!-- Pasek nawigacji — zawsze na wierzchu, poza view-app -->
  <nav class="tabbar hidden" id="tabbar">
    <button class="tab active" data-screen="start" title="Start">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>
    <button class="tab" data-screen="jezdzcy" title="Jeźdźcy">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg></button>
    <button class="tab-plus" id="btn-plus" title="Nowy trening">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-screen="konie" title="Konie">
      <img src="ikona koń.png" width="22" height="22" alt="Konie" class="tab-icon-img" style="display:block;"></button>
    <button class="tab" data-screen="treningi" title="Treningi">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v17H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg></button>
  </nav>

  <!-- Cwałek: pływający przycisk czatu -->
  <button id="cwalek-btn" title="Porozmawiaj z Cwałkiem" aria-label="Otwórz czat z Cwałkiem"><img src="horse-icon.svg" width="28" height="28" alt="Cwałek" style="display:block;filter:brightness(0) invert(1);"></button>

  <!-- Cwałek: panel czatu -->
  <div id="cwalek-panel" class="cwalek-panel hidden" role="dialog" aria-label="Cwałek — asystent stajni">
    <div class="cwalek-header">
      <span class="cwalek-avatar">🐴</span>
      <div>
        <div class="cwalek-name">Cwałek</div>
        <div class="cwalek-sub">asystent stajni</div>
      </div>
      <button class="cwalek-close" id="cwalek-close" aria-label="Zamknij">✕</button>
    </div>
    <div class="cwalek-messages" id="cwalek-messages">
      <div class="cwalek-msg cwalek-msg--bot">
        <p>Cześć! Jestem Cwałek 🐴 Pytaj o jeźdźców, treningi, postępy — chętnie pomogę!</p>
      </div>
    </div>
    <div class="cwalek-input-row">
      <input type="text" id="cwalek-input" placeholder="Napisz do Cwałka…" autocomplete="off" />
      <button id="cwalek-send" aria-label="Wyślij">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
